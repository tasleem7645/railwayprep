name: RRB Real-Time Notice Radar

on:
  schedule:
    # Run every 15 minutes 24x7 (lightweight direct 21-RRB + fresh <=36h news radar)
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      seed_only:
        description: 'Seed current unseen candidates without posting (true/false)'
        required: false
        default: 'false'
        type: string
      max_posts:
        description: 'Max fresh notices per run'
        required: false
        default: '4'
        type: string

permissions:
  contents: write

concurrency:
  group: rrb-fast-notices
  cancel-in-progress: false

jobs:
  notice-radar:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID || '-1002047409648' }}
      TELEGRAM_NOTICE_CHANNEL_ID: ${{ secrets.TELEGRAM_NOTICE_CHANNEL_ID }}
      SITE_URL: 'https://railwayprep.com'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Poppler (pdftoppm) for Page-1 PDF Previews
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils fonts-dejavu-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install --no-cache-dir requests feedparser pillow

      - name: Scan 21 Official RRBs & Fresh Breaking Railway Updates
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "TELEGRAM_BOT_TOKEN secret not set — running dry-run verification."
            python automation/telegram/rrb_exam_notices.py --dry-run
            exit 0
          fi
          SEED_FLAG=""
          if [ "${{ github.event.inputs.seed_only }}" = "true" ]; then
            SEED_FLAG="--seed-only"
          fi
          MAX_P="${{ github.event.inputs.max_posts }}"
          MAX_P="${MAX_P:-4}"
          python automation/telegram/rrb_exam_notices.py --max-posts "$MAX_P" $SEED_FLAG

      - name: Persist deduplication state & live cache safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain automation/telegram/state.json automation/telegram/live_notices_cache.json)" ]; then
            git add automation/telegram/state.json automation/telegram/live_notices_cache.json
            git commit -m "chore(telegram): update notice radar state [skip ci]"
            git pull --rebase origin main
            git push
          fi
